    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

op\">Hamza Khan<\u002Fa>\n  <a href=\"#cases\">Case studies<\u002Fa>\n  <a href=\"#experience\">Experience<\u002Fa>\n  <a href=\"#projects\">Projects<\u002Fa>\n  <a href=\"#stack\">Stack<\u002Fa>\n  <a class=\"btn btn-primary\" href=\"#contact\">Contact<\u002Fa>\n<\u002Fnav>\n\n<div id=\"top\" style=\"max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,72px);\">\n\n  <section data-screen-label=\"Hero\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:48px;align-items:stretch;padding:72px 0 64px;\">\n    <div style=\"display:flex;flex-direction:column;justify-content:space-between;gap:40px;\">\n      <div>\n        <p style=\"margin:0 0 28px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);\">Islamabad, Pakistan · Open to senior, architect and lead roles<\u002Fp>\n        <h1 style=\"margin:0 0 0 -0.058em;font-family:var(--font-heading);font-weight:800;font-size:clamp(56px,8.4vw,120px);line-height:.94;letter-spacing:-0.035em;\">\n          <span style=\"display:block;\">Hamza<\u002Fspan><span style=\"display:block;\">Khan<\u002Fspan>\n        <\u002Fh1>\n        <p style=\"margin:28px 0 0;font-size:20px;font-weight:600;line-height:28px;\">Senior Backend Engineer, Architect &amp; Tech Lead<\u002Fp>\n        <p style=\"margin:12px 0 0;font-size:17px;line-height:28px;max-width:50ch;color:color-mix(in srgb,var(--color-text) 78%,transparent);\">6+ years designing, building, and operating distributed systems and cloud-native backend platforms — from high-availability APIs to AI-powered clinical workflows.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n        <a class=\"btn btn-primary\" href=\"#cases\" style=\"min-width:200px;justify-content:space-between;\">View case studies\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"cv.pdf\" download=\"Hamza-Khan-CV.pdf\">Download CV<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"mailto:hamzaashes@gmail.com?subject=Let%27s%20talk\">Hire me<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <figure style=\"margin:0;display:flex;flex-direction:column;border:2px solid var(--color-text);min-height:460px;background:var(--color-bg);\">\n      <div style=\"display:flex;justify-content:space-between;gap:16px;padding:10px 14px;border-bottom:2px solid var(--color-text);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-feature-settings:'tnum' 1;\">\n        <span>Fig. 01 — Cluster load, live<\u002Fspan>\n        <span ref=\"{{ readoutRef }}\" style=\"color:var(--color-accent-700);\">Events 00<\u002Fspan>\n      <\u002Fdiv>\n      <div ref=\"{{ sceneRef }}\" style=\"flex:1;position:relative;min-height:400px;\"><\u002Fdiv>\n      <figcaption style=\"display:flex;justify-content:space-between;gap:16px;padding:10px 14px;border-top:2px solid var(--color-text);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 70%,transparent);\">\n        <span>Move to tilt<\u002Fspan><span>Click a node to send a pulse<\u002Fspan>\n      <\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section aria-label=\"By the numbers\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:2px;background:var(--color-divider);border-top:2px solid var(--color-divider);border-bottom:2px solid var(--color-divider);\">\n    <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n      <div style=\"background:var(--color-bg);padding:28px 24px 28px 0;\">\n        <p style=\"margin:0;font-family:var(--font-heading);font-weight:800;font-size:clamp(34px,3.6vw,48px);line-height:1;color:var(--color-accent);letter-spacing:-0.02em;\">{{ s.v }}<\u002Fp>\n        <p style=\"margin:14px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 70%,transparent);\">{{ s.l }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section id=\"cases\" data-screen-label=\"Case studies\" style=\"padding:96px 0 32px;scroll-margin-top:64px;\">\n    <p style=\"margin:0 0 16px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700);font-feature-settings:'tnum' 1;\">01 — Case studies<\u002Fp>\n    <h2 style=\"margin:0 0 48px;font-family:var(--font-heading);font-weight:800;font-size:clamp(32px,4.2vw,56px);line-height:1.04;letter-spacing:-0.025em;max-width:18ch;\">Who needed it, and how I built it<\u002Fh2>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start;\">\n      <div role=\"tablist\" style=\"flex:1 1 280px;display:flex;flex-direction:column;border-bottom:2px solid var(--color-divider);\">\n        <sc-for list=\"{{ caseList }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <div role=\"tab\" tabindex=\"0\" sc-camel-on-click=\"{{ c.pick }}\" style=\"display:grid;grid-template-columns:40px minmax(0,1fr);gap:16px;padding:20px 12px 20px 0;border-top:2px solid var(--color-divider);cursor:pointer;background:{{ c.bg }};\" style-hover=\"background:var(--color-accent-100)\">\n            <span style=\"font-weight:800;font-size:15px;font-feature-settings:'tnum' 1;color:{{ c.fg }};padding-left:12px;\">{{ c.n }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:4px;\">\n              <span style=\"font-weight:700;font-size:17px;line-height:22px;color:{{ c.fg }};\">{{ c.title }}<\u002Fspan>\n              <span style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 70%,transparent);\">{{ c.where }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <article style=\"flex:3 1 520px;min-width:0;border-top:2px solid var(--color-text);\">\n 2Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;3D scene&quot;},&quot;gridSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;min&quot;:4,&quot;max&quot;:11,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;3D scene&quot;}}\">\nconst CASES = [\n  { title: 'AI-assisted clinical documentation', where: 'Ignis Health · Axis-360',\n    story: 'As a clinician, I want my visit notes drafted and summarized for me, so I can spend the appointment with the patient instead of the keyboard.',\n    constraint: 'Every record is protected health information, so the whole flow had to be HIPAA-compliant — and documentation could never slow down scheduling, billing or the visit itself.',\n    steps: [\n      { h: 'Drew the service boundaries.', d: 'Split clinical workflows, scheduling, billing and documentation into clear services with their own APIs and data models in Django REST Framework and PostgreSQL.' },\n      { h: 'Moved heavy work off the request path.', d: 'Documentation jobs run in fault-tolerant Celery + Redis pipelines on cloud-managed messaging, with guaranteed delivery.' },\n      { h: 'Integrated LLM workflows.', d: 'Automated clinical documentation and summarization as background jobs that hand results back to the clinician.' },\n      { h: 'Secured it end to end.', d: 'OAuth2 / JWT, RBAC, and encryption at rest and in transit across every service that touches PHI.' }\n    ],\n    outcome: 'Reduced manual documentation effort for clinicians on a platform built from the ground up for thousands of daily active users.',\n    metric: 'HIPAA', tags: ['Django REST Framework', 'PostgreSQL', 'Celery', 'Redis', 'LLM Integration', 'HIPAA'] },\n  { title: 'Halving API latency at peak', where: 'Ignis Health · Axis-360',\n    story: 'As a patient or front-desk user, I want scheduling and records screens to respond instantly, even during the busiest hours.',\n    constraint: 'Traffic was growing on live clinical workflows; a rewrite was off the table, so the gains had to come from the existing services.',\n    steps: [\n      { h: 'Measured first.', d: 'Used Prometheus and Grafana to find the endpoints dominating P95 latency.' },\n      { h: 'Optimized queries.', d: 'Rewrote expensive ORM queries and reshaped data access on the hottest paths.' },\n      { h: 'Indexed for real access patterns.', d: 'Added PostgreSQL indexes matched to how the product actually reads data.' },\n      { h: 'Cached deliberately.', d: 'Introduced Redis caching strategies for read-heavy data with clear invalidation rules.' }\n    ],\n    outcome: 'Reduced P95 API latency by roughly half across the platform.',\n    metric: '−50%', tags: ['PostgreSQL', 'Redis', 'Query optimization', 'Prometheus', 'Grafana'] },\n  { title: 'Cloud migration and safe releases', where: 'Ignis Health · Platform',\n    story: 'As an engineer on the team, I want to ship often without worrying that a release will take the platform down.',\n    constraint: 'A healthcare platform cannot take long maintenance windows, and the team needed visibility into background job throughput.',\n    steps: [\n      { h: 'Migrated to AWS.', d: 'Led the move to EKS, RDS, S3 and CloudFront to improve availability.' },\n      { h: 'Automated the pipeline.', d: 'CI/CD with automated testing gates on every change.' },\n      { h: 'Released with blue/green.', d: 'New versions go live alongside the old one, so rollback is a switch, not a scramble.' },\n      { h: 'Set observability standards.', d: 'Prometheus, Grafana and centralized logging for system health and job throughput.' }\n    ],\n    outcome: 'Improved availability, deployment safety and operational visibility, enabling safe and frequent releases.',\n    metric: 'EKS', tags: ['AWS EKS', 'RDS', 'CloudFront', 'GitHub Actions', 'Blue/Green'] },\n  { title: 'Releases without babysitting', where: 'InvoZone · Client SaaS',\n    story: 'As a client product team, we want releases that ship on their own, without an engineer watching every deploy.',\n    constraint: 'Multiple cloud-native client products, each multi-tenant, with billing and authentication that had to keep working through every release.',\n    steps: [\n      { h: 'Containerized the services.', d: 'Docker and Kubernetes gave identical environments across staging and production.' },\n      { h: 'Designed CI/CD.', d: 'Automated test suites gate every release in the pipeline.' },\n      { h: 'Decoupled long-running work.', d: 'Event-driven workflows and serverless jobs on AWS Lambda and GCP Cloud Run.' },\n      { h: 'Integrated billing and auth.', d: 'Stripe and Auth0 for multi-tenant SaaS billing and authentication.' }\n    ],\n    outcome: 'Reduced manual release intervention by about 80% for products serving tens of thousands of daily active users.',\n    metric: '−80%', tags: ['Docker', 'Kubernetes', 'AWS Lambda', 'GCP Cloud Run', 'Stripe', 'Auth0'] },\n  { title: 'A live classroom at national scale', where: 'Taleemabad · LMS',\n    story: 'As a student in a live class, I want questions and answers to appear the moment they are sent, wherever I am in Pakistan.',\n    constraint: 'A national LMS with 100K+ active students; real-time features could not degrade content or analytics.',\n    steps: [\n      { h: 'Went real-time.', d: 'WebSockets and Redis pub/sub for live classroom interactions.' },\n      { h: 'Queued the background work.', d: 'Task queues and Redis for notifications, content sync and analytics processing.' },\n      { h: 'Tuned the hot endpoints.', d: 'Optimized PostgreSQL queries and data models for high-traffic paths.' },\n      { h: 'Made content findable.', d: 'Search and indexing across large educational datasets.' }\n    ],\n    outcome: 'Backend services that held up under real load for a national-scale learning platform.',\n    metric: '100K+', tags: ['Django', 'WebSockets', 'Redis pub/sub', 'PostgreSQL', 'Elasticsearch'] }\n];\n\nconst EXPS = [\n  { period: 'Dec 2022 – Present', company: 'Ignis Health', loc: 'USA (Remote)', title: 'Senior Software Engineer · Backend / Architect / Tech Lead',\n    bullets: [\n      'Architected and led development of Axis-360, a HIPAA-compliant telehealth platform built from the ground up — covering clinical workflows, scheduling, billing, and AI-assisted documentation.',\n      'Owned backend service architecture and boundaries; designed scalable APIs and data models using Django REST Framework and PostgreSQL for thousands of daily active users.',\n      'Built fault-tolerant async pipelines using Celery, Redis, and cloud-managed messaging to process high volumes of clinical and operational events with guaranteed delivery.',\n      'Improved system performance through query optimization, caching strategies, and indexing — reducing P95 API latency by ~50%.',\n      'Led cloud infrastructure migration to AWS (EKS, RDS, S3, CloudFront), improving availability, deployment safety, and operational visibility.',\n      'Integrated LLM-powered workflows to automate clinical documentation and summarization, reducing manual effort for clinicians.',\n      'Implemented CI/CD pipelines with automated testing and blue/green deployments, enabling safe and frequent releases.',\n      'Established observability standards (Prometheus, Grafana, centralized logging) to monitor system health and background job throughput; mentored junior engineers and drove architectural decisions.'\n    ], tags: ['Django', 'FastAPI', 'PostgreSQL', 'Celery', 'Redis', 'AWS EKS', 'LLM Integration', 'HIPAA', 'Prometheus'] },\n  { period: 'Dec 2020 – Dec 2022', company: 'InvoZone', loc: 'Pakistan', title: 'Software Engineer · Backend',\n    bullets: [\n      'Designed and shipped backend services for multiple cloud-native client products using Django and RESTful APIs, supporting tens of thousands of daily active users.',\n      'Built event-driven workflows using async task processing and messaging systems to decouple request handling from long-running background jobs.',\n      'Deployed serverless workloads on AWS Lambda and GCP Cloud Run for background processing, scheduled tasks, and API extensions.',\n      'Containerized microservices with Docker and Kubernetes, enabling horizontal scaling and consistent environments across staging and production.',\n      'Contributed to blockchain-integrated backend systems — implemented secure smart contract interactions and off-chain processing pipelines.',\n      'Designed CI/CD pipelines with automated testing, reducing manual release intervention by ~80%; integrated Stripe and Auth0 for multi-tenant SaaS billing and authentication.',\n      'Built data ingestion and transformation pipelines with a focus on reliability, idempotency, and observability.'\n    ], tags: ['Django', 'AWS Lambda', 'GCP Cloud Run', 'Docker', 'Kubernetes', 'GitHub Actions', 'Blockchain', 'Stripe'] },\n  { period: 'Jul 2019 – Dec 2020', company: 'Taleemabad', loc: 'Pakistan', title: 'Associate Software Engineer',\n    bullets: [\n      'Developed and maintained backend services for a national-scale LMS serving 100K+ active students across Pakistan.',\n      'Built async background workflows using task queues and Redis for notifications, content sync, and analytics processing.',\n      'Implemented real-time features using WebSockets and Redis pub/sub for live classroom interactions.',\n      'Optimized PostgreSQL queries and data models to improve response times for high-traffic endpoints; integrated search and indexing to improve content discovery across large educational datasets.',\n      'Supported production deployments and monitoring — gained hands-on experience operating backend systems under real load.'\n    ], tags: ['Django', 'PostgreSQL', 'Redis', 'WebSockets', 'Elasticsearch'] }\n];\n\nconst PROJECTS = [\n  { key: 'volta', repo: 'https://github.com/khanashes/volta', name: 'Volta Engine', sub: 'Serverless runtime · sub-100ms cold starts',\n    desc: 'A serverless microVM runtime using Linux userfaultfd for lazy memory restoration. Snapshots VM state and resumes on-demand — booting the VM before full memory is copied, achieving sub-200ms cold starts.',\n    path: ['Request', 'Daemon (voltad)', 'Snapshot Restore (UFFD)', 'MicroVM', 'Response'],\n    bullets: [\n      'KVM microVMs — Firecracker-based VM isolation on Linux for strong security boundaries and minimal overhead.',\n      'UFFD lazy restore — Memory loaded on-demand via userfaultfd; VM boots before full memory copy completes.',\n      'Snapshot / Restore — Capture and resume VM state at any checkpoint; enables near-instant scale-out from warm snapshots.',\n      'Python SDK — Thin async client over HTTP API (spawn, resume, snapshot) with a daemon (voltad) managing the VM lifecycle.'\n    ],\n    stats: [{ v: '<100ms', l: 'Cold start target' }, { v: '<200ms', l: 'Lazy restore' }, { v: 'MIT', l: 'License' }, { v: 'Firecracker', l: 'Backend' }] },\n  { key: 'flow', repo: 'https://github.com/khanashes/flowmesh', name: 'FlowMesh', sub: 'Unified event fabric · cache + queues + streams',\n    desc: 'One clustered platform for the three core messaging primitives — key-value caching, job queues and event streaming — replacing a Redis + RabbitMQ + Kafka stack with a shared storage engine, SDK, metrics and dashboard.',\n    path: ['Client', 'Unified API', 'Queue / Stream / Cache', 'Shared storage'],\n    bullets: [\n      'Unified platform — KV store, job queues and event streams on one shared storage engine, API and SDK.',\n      'Event streams — append-only partitioned logs with consumer groups, replay semantics and backpressure handling.',\n      'Time-travel debugging — rewind to any offset or timestamp and replay events into sandbox workers.',\n      'Built-in observability — OpenTelemetry tracing, Prometheus metrics, and a Web UI for queues, streams and replay; JSON Schema validation on write; Go and Python SDKs.'\n    ],\n    stats: [{ v: 'MIT', l: 'License' }, { v: 'Go 1.24+', l: 'Engine' }, { v: 'KV · Queue · Stream', l: 'Primitives' }, { v: 'Go · Python', l: 'SDKs' }] }\n];\n\nconst STACK = [\n  { cat: 'Languages', items: ['Python', 'SQL', 'Go', 'JavaScript', 'TypeScript', 'Bash'], core: 2 },\n  { cat: 'Backend & Frameworks', items: ['Django', 'Django REST Framework', 'FastAPI', 'Celery'], core: 4 },\n  { cat: 'Datastores', items: ['PostgreSQL', 'Redis', 'MongoDB', 'Elasticsearch'], core: 2 },\n  { cat: 'Cloud & Infrastructure', items: ['AWS (EC2, EKS, ECS, Lambda, RDS, S3, CloudFront)', 'GCP (Cloud Run, Pub/Sub)', 'Docker', 'Kubernetes', 'Helm', 'Terraform'], core: 4 },\n  { cat: 'DevOps & Observability', items: ['GitHub Actions', 'Prometheus', 'Grafana', 'CloudWatch', 'Blue/Green Deployments', 'GitOps'], core: 3 },\n  { cat: 'Security & Auth', items: ['OAuth2 / JWT', 'RBAC', 'HIPAA Compliance', 'Encryption at rest & in transit'], core: 3 }\n];\n\nconst AWARDS = [\n  { t: 'IEEE Xtreme Programming Competition', s: 'International · Top 3 Finish', b: 'Top 3', cls: 'tag-accent' },\n  { t: 'Growth Driver of the Year', s: 'InvoZone · Internal Recognition Award', b: 'Award', cls: 'tag-accent' },\n  { t: 'AWS Certified Cloud Practitioner', s: 'Amazon Web Services', b: 'In Progress', cls: 'tag-outline' },\n  { t: 'Python for Data Science', s: 'IBM · Professional Certificate', b: 'Completed', cls: 'tag-neutral' },\n  { t: 'Advanced Django', s: 'Udemy · ORM Optimization & Async Tasks', b: 'Completed', cls: 'tag-neutral' }\n];\n\nconst DIAGRAMS = [\n  { nodes: [\n    ['ui','Clinician app','Visit + notes',10,138,0,'Where the clinician records the visit. It talks only to the API, so the UI never knows about queues or models.'],\n    ['api','Django REST API','Service boundaries',200,138,0,'Owns clinical workflows, scheduling and billing behind clear service boundaries, with serializers and permissions defined per resource.'],\n    ['pg','PostgreSQL','Clinical data',390,20,0,'System of record for patients, visits and documentation drafts. Data models were designed for thousands of daily active users.'],\n    ['redis','Redis broker','Task messaging',390,138,1,'Holds documentation jobs between the API and the workers, so a slow job never blocks a request.'],\n    ['cel','Celery workers','Async pipelines',580,138,1,'Fault-tolerant workers with retries. Jobs are acknowledged only after they finish, which gives guaranteed delivery.'],\n    ['llm','LLM service','Draft + summarize',580,258,2,'Receives visit context and returns a drafted note and summary. The result is saved back as a draft for the clinician to review.'],\n    ['auth','Auth + RBAC','OAuth2 · JWT',200,20,3,'Every request is authenticated with OAuth2/JWT and checked against role-based permissions. Data is encrypted at rest and in transit.']],\n    edges: [['ui','api','REST'],['api','pg','ORM'],['api','redis','enqueue'],['redis','cel','consume'],['cel','pg','save'],['cel','llm','prompt'],['auth','api','verify']] },\n  { nodes: [\n    ['client','Client','Scheduling UI',10,138,0,'Front-desk and patient screens whose response time defined the problem.'],\n    ['api','Django API','P95 baseline',200,138,0,'The endpoints under load. Before the changes, the slowest 5% of requests were the problem to fix.'],\n    ['pg','PostgreSQL','Clinical data',580,138,0,'Primary datastore. Most slow requests spent their time here.'],\n    ['prom','Prometheus','Per-endpoint latency',200,258,0,'Scrapes request metrics so the slowest endpoints can be ranked by P95 before touching any code.'],\n    ['graf','Grafana','P95 dashboards',390,258,0,'Dashboards that show whether each change actually moved P95.'],\n    ['ql','Query layer','Fewer round trips',390,138,1,'Rewrote expensive ORM queries and reshaped data access on the hottest paths.'],\n    ['idx','Indexes','Match access',580,20,2,'PostgreSQL indexes added for the way the product really filters and sorts.'],\n    ['cache','Redis cache','Read-heavy data',390,20,3,'Caches read-heavy data with explicit invalidation rules so stale reads stay bounded.']],\n    edges: [['client','api','HTTP'],['api','pg','SQL',1],['api','ql','ORM'],['ql','pg','SQL'],['api','prom','metrics'],['prom','graf','query'],['idx','pg','lookup'],['api','cache','get/set']] },\n  { nodes: [\n    ['cf','CloudFront','CDN edge',10,138,0,'Serves static assets from the edge and fronts the application for availability.'],\n    ['s3','S3','Static assets',10,258,0,'Object storage for static content and files. CloudFront reads from it.'],\n    ['eks','EKS','Containers',200,138,0,'Kubernetes cluster running the services. Moving here improved availability and gave consistent deployments.'],\n    ['rds','RDS','Managed Postgres',390,20,0,'Managed PostgreSQL with automated backups, replacing self-run database hosts.'],\n    ['gh','GitHub Actions','CI pipeline',10,20,1,'Runs on every change: build, test, and publish the container image.'],\n    ['tests','Test gate','Release blocker',200,20,1,'Automated tests must pass before an image can be deployed. Nothing reaches the cluster without them.'],\n    ['blue','Blue','Live version',390,138,2,'The version currently serving traffic.'],\n    ['green','Green','New version',390,258,2,'The new version starts alongside blue and is checked before traffic moves. Rollback is switching back.'],\n    ['obs','Observability','Prom · Grafana · logs',580,138,3,'Prometheus, Grafana and centralized logging report system health and background job throughput for both versions.']],\n    edges: [['cf','eks','HTTPS'],['s3','cf','origin'],['eks','rds','SQL'],['gh','tests','build'],['tests','eks','deploy'],['eks','blue','route'],['eks','green','route'],['blue','obs','metrics'],['green','obs','metrics']] },\n  { nodes: [\n    ['dock','Docker images','Same everywhere',10,138,0,'Each service is packaged once and runs identically in staging and production.'],\n    ['api','Django API','Kubernetes pods',200,138,0,'RESTful backend services for client products, scaled horizontally on Kubernetes.'],\n    ['client','Client apps','Multi-tenant',10,258,0,'Multiple client products served by the same backend patterns.'],\n    ['gh','GitHub Actions','CI/CD',10,20,1,'Pipeline that builds, tests and ships automatically.'],\n    ['tests','Test gate','Every release',200,20,1,'Automated tests guard each release, which cut manual release intervention by about 80%.'],\n    ['q','Event queue','Async tasks',390,138,2,'Separates request handling from long-running work so APIs stay fast.'],\n    ['fn','Lambda · Run','Background jobs',580,138,2,'Serverless workers on AWS Lambda and GCP Cloud Run for background processing, scheduled tasks and API extensions.'],\n    ['auth','Auth0','Authentication',200,258,3,'Handles login and tenant identity for the SaaS products.'],\n    ['stripe','Stripe','Billing',390,258,3,'Subscription billing for multi-tenant SaaS.']],\n    edges: [['dock','api','run'],['client','api','HTTPS'],['gh','tests','build'],['tests','api','deploy'],['api','q','publish'],['q','fn','trigger'],['auth','api','tokens'],['api','stripe','charge']] },\n  { nodes: [\n    ['stu','Students','Live classroom',10,138,0,'100K+ active students across Pakistan using lessons and live classes.'],\n    ['ws','WebSocket server','Live events',200,138,0,'Keeps a connection open per participant so questions and answers show up instantly.'],\n    ['ps','Redis pub/sub','Fan-out',390,138,0,'Broadcasts each event to every server holding a classroom connection.'],\n    ['api','Django API','Content + analytics',200,258,0,'Serves lessons, progress and analytics over REST.'],\n    ['wk','Task workers','Notify · sync',580,138,1,'Task queues on Redis run notifications, content sync and analytics processing off the request path.'],\n    ['pg','PostgreSQL','Tuned queries',390,258,2,'Queries and data models optimized for the highest-traffic endpoints.'],\n    ['es','Elasticsearch','Content search',580,258,3,'Search index across large educational datasets so content is easy to find.']],\n    edges: [['stu','ws','WS'],['ws','ps','publish'],['stu','api','HTTPS'],['ps','wk','tasks'],['api','pg','SQL'],['pg','es','index']] }\n];\nconst PD = {\n  volta: { trace: ['client','daemon','snap','uffd','fc','resp'], nodes: [\n    ['client','Python SDK','spawn · resume',10,138,0,'Thin async client over the HTTP API with spawn, resume and snapshot calls. Callers ask for a VM and never touch KVM.'],\n    ['daemon','voltad','VM lifecycle',200,138,0,'The daemon that manages the VM lifecycle: creates, restores, snapshots and tears down microVMs.'],\n    ['snap','Snapshot store','State + memory',200,258,0,'Captured VM state and memory image at a checkpoint. Warm snapshots make near-instant scale-out possible.'],\n    ['uffd','UFFD handler','userfaultfd',390,138,0,'Registers guest memory with userfaultfd. Pages are copied from the snapshot only when the guest touches them.'],\n    ['fc','Firecracker','KVM microVM',580,138,0,'The microVM boots before full memory is copied. Firecracker gives strong isolation with minimal overhead.'],\n    ['kvm','Linux KVM','Hardware isolation',580,258,0,'Hardware virtualization under Firecracker that keeps workloads separate.'],\n    ['resp','Response','Result to caller',580,20,0,'Output returns to the SDK after the VM runs the request. Targets: cold start under 100ms, lazy restore under 200ms.']],\n    edges: [['client','daemon','HTTP'],['daemon','snap','restore'],['snap','uffd','pages'],['uffd','fc','faults'],['fc','kvm','KVM'],['fc','resp','result']] },\n  flow: { trace: ['sdk','api','jq','store'], nodes: [\n    ['sdk','Clients · SDKs','Go · Python',10,138,0,'Go and Python SDKs share one client model for all three primitives, so an app talks to a single system instead of three.'],\n    ['api','Unified API','gRPC · REST · schema',200,138,0,'One entry point (gRPC and HTTP) for cache, queue and stream calls, with JSON Schema validation on write.'],\n    ['kv','Key-value cache','Fast reads',390,20,0,'The Redis-style primitive: get/set of small values, served by the same engine as the queues and streams.'],\n    ['jq','Job queues','Work distribution',390,138,0,'The RabbitMQ/SQS-style primitive: jobs are enqueued once and handed to workers.'],\n    ['stream','Event streams','Partitioned logs',390,258,0,'The Kafka-style primitive: append-only logs with consumer groups and replay from any offset or timestamp.'],\n    ['store','Shared storage engine','Durable · recovery',580,138,0,'One storage engine under all three primitives, built for durability and recovery after failure.'],\n    ['obs','Web UI · tracing','OTel · Prometheus',200,20,0,'OpenTelemetry tracing and Prometheus metrics span every primitive; the Web UI adds queue, stream and replay dashboards, including time-travel debugging.']],\n    edges: [['sdk','api','call'],['api','kv','get/set'],['api','jq','enqueue'],['api','stream','append'],['kv','store','persist'],['jq','store','persist'],['stream','store','persist'],['api','obs','traces']] }\n};\nconst pad = n => String(n).padStart(2, '0');\n\nclass Component extends DCLogic {\n  state = { caseIdx: 0, stepIdx: 3, openExp: 0, cat: 'All', trace: { volta: -1, flow: -1 } };\n  sceneRef = React.createRef();\n  readoutRef = React.createRef();\n\n  componentDidMount() { this.initScene(); }\n  componentWillUnmount() {\n    this.dead = true;\n    cancelAnimationFrame(this.raf);\n    Object.values(this.timers || {}).forEach(clearInterval);\n    if (this.ro) this.ro.disconnect();\n    if (this.renderer) this.renderer.dispose();\n  }\n  componentDidUpdate(prev) {\n    if (this.THREE && prev.gridSize !== this.props.gridSize) { this.build(this.props.gridSize ?? 7); this.resize(); }\n  }\n\n  async initScene() {\n    const el = this.sceneRef.current; if (!el) return;\n    let THREE;\n    try { THREE = await import(window.__resources.three); } catch (e) { return; }\n    if (this.dead) return;\n    this.THREE = THREE;\n    const cs = getComputedStyle(el);\n    const v = (n, f) => cs.getPropertyValue(n).trim() || f;\n    const ink = v('--color-text', '#201e1d'), bg = v('--color-bg', '#f3f2f2'), red = v('--color-accent', '#ec3013');\n    const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });\n    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));\n    r.domElement.style.cssText = 'position:absolute;inset:0;display:block;width:100%;height:100%;cursor:crosshair';\n    el.appendChild(r.domElement);\n    this.renderer = r;\n    this.scene = new THREE.Scene();\n    this.cam = new THREE.OrthographicCamera(-5, 5, 5, -5, -100, 100);\n    this.cam.position.set(8, 6.5, 8); this.cam.lookAt(0, 0.9, 0);\n    this.group = new THREE.Group(); this.scene.add(this.group);\n    this.geo = new THREE.BoxGeometry(1, 1, 1); this.geo.translate(0, 0.5, 0);\n    this.edgeGeo = new THREE.EdgesGeometry(this.geo);\n    const off = { polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 };\n    this.fillMat = new THREE.MeshBasicMaterial({ color: bg, ...off });\n    this.hotMat = new THREE.MeshBasicMaterial({ color: red, ...off });\n    this.lineMat = new THREE.LineBasicMaterial({ color: ink });\n    this.ray = new THREE.Raycaster();\n    this.pointer = { x: 0, y: 0 }; this.pulses = []; this.frame = 0;\n    this.build(this.props.gridSize ?? 7);\n\n    el.addEventListener('pointermove', e => {\n      const b = el.getBoundingClientRect();\n      this.pointer.x = (e.clientX - b.left) / b.width * 2 - 1;\n      this.pointer.y = (e.clientY - b.top) / b.height * 2 - 1;\n    });\n    el.addEventListener('pointerleave', () => { this.pointer.x = 0; this.pointer.y = 0; });\n    el.addEventListener('click', e => {\n      const b = el.getBoundingClientRect();\n      const ndc = new THREE.Vector2((e.clientX - b.left) / b.width * 2 - 1, -((e.clientY - b.top) / b.height * 2 - 1));\n      this.ray.setFromCamera(ndc, this.cam);\n      const hit = this.ray.intersectObjects(this.cells.map(c => c.mesh))[0];\n      const c = hit ? hit.object.userData.cell : { i: (this.N - 1) / 2, j: (this.N - 1) / 2 };\n      this.pulses.push({ i: c.i, j: c.j, t: performance.now() });\n    });\n    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(el);\n    this.resize();\n    this.loop();\n  }\n\n  build(N) {\n    const THREE = this.THREE;\n    this.N = N;\n    while (this.group.children.length) this.group.remove(this.group.children[0]);\n    this.cells = [];\n    const sp = 1.3;\n    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {\n      const holder = new THREE.Group();\n      const mesh = new THREE.Mesh(this.geo, this.fillMat);\n      const line = new THREE.LineSegments(this.edgeGeo, this.lineMat);\n      holder.add(mesh); holder.add(line);\n      holder.position.set((i - (N - 1) / 2) * sp, 0, (j - (N - 1) / 2) * sp);\n      holder.scale.set(1, 0.4, 1);\n      const c = { i, j, holder, mesh, heat: 0, phase: Math.random() * 6.28 };\n      mesh.userData.cell = c;\n      this.group.add(holder); this.cells.push(c);\n    }\n    const half = (N * sp) / 2 + 0.2;\n    const pts = [[-half, -half], [half, -half], [half, half], [-half, half]].map(([x, z]) => new THREE.Vector3(x, 0, z));\n    this.group.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), this.lineMat));\n  }\n\n  resize() {\n    const el = this.sceneRef.current; if (!el || !this.renderer) return;\n    const w = el.clientWidth || 1, h = el.clientHeight || 1, a = w / h;\n    this.renderer.setSize(w, h, false);\n    const s = this.N * 0.78;\n    if (a >= 1) Object.assign(this.cam, { left: -s * a, right: s * a, top: s, bottom: -s });\n    else Object.assign(this.cam, { left: -s, right: s, top: s / a, bottom: -s / a });\n    this.cam.updateProjectionMatrix();\n  }\n\n  loop = () => {\n    if (this.dead) return;\n    this.raf = requestAnimationFrame(this.loop);\n    const motion = this.props.motion ?? true;\n    const now = performance.now();\n    const t = motion ? now / 1000 : 0;\n    const mid = (this.N - 1) / 2;\n    let hot = 0;\n    for (const c of this.cells) {\n      const d = Math.hypot(c.i - mid, c.j - mid);\n      if (motion && Math.random() < 0.0025) c.heat = 1;\n      c.heat *= 0.975;\n      let ring = 0;\n      for (const p of this.pulses) {\n        const age = (now - p.t) / 1000;\n        const dd = Math.hypot(c.i - p.i, c.j - p.j);\n        ring = Math.max(ring, Math.exp(-Math.pow(dd - age * 7, 2) * 1.2) * Math.max(0, 1 - age / 1.4));\n      }\n      const base = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * 1.1 - d * 0.75 + c.phase * 0.25));\n      const target = base + c.heat * 1.8 + ring * 2.2;\n      c.holder.scale.y += (target - c.holder.scale.y) * 0.14;\n      const isHot = c.heat > 0.4 || ring > 0.35;\n      c.mesh.material = isHot ? this.hotMat : this.fillMat;\n      if (isHot) hot++;\n    }\n    this.pulses = this.pulses.filter(p => now - p.t < 1500);\n    this.group.rotation.y += (this.pointer.x * 0.4 - this.group.rotation.y) * 0.06;\n    this.group.rotation.x += (this.pointer.y * 0.1 - this.group.rotation.x) * 0.06;\n    this.renderer.render(this.scene, this.cam);\n    if (++this.frame % 8 === 0 && this.readoutRef.current) this.readoutRef.current.textContent = 'Events ' + pad(hot);\n  };\n\n  runTrace(key, len) {\n    this.timers = this.timers || {};\n    clearInterval(this.timers[key]);\n    let i = 0;\n    const set = n => this.setState(s => ({ trace: { ...s.trace, [key]: n } }));\n    set(0);\n    this.timers[key] = setInterval(() => {\n      i++;\n      if (i >= len + 2) { clearInterval(this.timers[key]); set(-1); return; }\n      set(Math.min(i, len - 1));\n    }, 520);\n  }\n\n  renderVals() {\n    const { caseIdx, openExp, cat, trace } = this.state;\n    const a = CASES[caseIdx];\n    const go = d => () => this.setState(s => ({ caseIdx: (s.caseIdx + d + CASES.length) % CASES.length, stepIdx: 3 }));\n    const step = this.state.stepIdx;\n    const cats = ['All', ...STACK.map(s => s.cat)];\n    return {\n      sceneRef: this.sceneRef, readoutRef: this.readoutRef,\n      stats: [\n        { v: '6+ yrs', l: 'Engineering experience' },\n        { v: '50%', l: 'P95 latency reduction' },\n        { v: '100K+', l: 'Users served' },\n        { v: 'HIPAA', l: 'Compliant systems designed & built' }\n      ],\n      caseCount: pad(CASES.length),\n      caseList: CASES.map((c, i) => ({\n        n: pad(i + 1), title: c.title, where: c.where,\n        bg: i === caseIdx ? 'var(--color-accent-100)' : 'transparent',\n        fg: i === caseIdx ? 'var(--color-accent-700)' : 'var(--color-text)',\n        pick: () => this.setState({ caseIdx: i, stepIdx: 3 })\n      })),\n      dNodes: DIAGRAMS[caseIdx].nodes, dEdges: DIAGRAMS[caseIdx].edges, dStep: step,\n      stepLabel: pad(step + 1) + ' / 04 — ' + a.steps[step].h,\n      play: () => { this.timers = this.timers || {}; clearInterval(this.timers.play); let k = 0; this.setState({ stepIdx: 0 });\n        this.timers.play = setInterval(() => { k++; this.setState({ stepIdx: k }); if (k >= 3) clearInterval(this.timers.play); }, 1100); },\n      active: { ...a, n: pad(caseIdx + 1), steps: a.steps.map((s, i) => ({ ...s, n: pad(i + 1),\n        bg: i === step ? 'var(--color-accent-100)' : 'transparent',\n        pick: () => { clearInterval((this.timers || {}).play); this.setState({ stepIdx: i }); } })) },\n      prevCase: go(-1), nextCase: go(1),\n      exps: EXPS.map((x, i) => ({ ...x, open: openExp === i, sign: openExp === i ? '−' : '+',\n        toggle: () => this.setState(s => ({ openExp: s.openExp === i ? -1 : i })) })),\n      projects: PROJECTS.map(p => {\n        const at = trace[p.key], tr = PD[p.key].trace;\n        return { ...p, nodes: PD[p.key].nodes, edges: PD[p.key].edges,\n          trail: at >= 0 ? tr.slice(0, at + 1) : [], current: at >= 0 ? tr[at] : '',\n          trace: () => this.runTrace(p.key, tr.length) };\n      }),\n      catBtns: cats.map(c => ({ label: c, cls: c === cat ? 'btn-primary' : 'btn-secondary', pick: () => this.setState({ cat: c }) })),\n      stackRows: STACK.filter(s => cat === 'All' || s.cat === cat).map(s => ({\n        cat: s.cat, items: s.items.map((label, i) => ({ label, cls: i < s.core ? 'tag-accent' : 'tag-neutral' }))\n      })),\n      awards: AWARDS\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
